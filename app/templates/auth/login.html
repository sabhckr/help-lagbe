{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow">
  <h2 class="text-2xl font-bold mb-6">Login</h2>
  <form method="POST">
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border rounded px-3 py-2">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required class="w-full border rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-primary text-white py-2 rounded font-medium">Login</button>
  </form>
  <p class="mt-4 text-sm text-center"><a href="{{ url_for('auth.register') }}" class="text-primary">Register</a></p>
  <p class="mt-2 text-xs text-slate-500 text-center">Demo: admin@helplagbe.local / admin123</p>
</div>
{% endblock %}
