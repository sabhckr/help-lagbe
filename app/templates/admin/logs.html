{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Sensitive Access Logs</h2>
<div class="bg-white rounded shadow overflow-hidden">
  <table class="min-w-full text-sm">
    <thead class="bg-slate-50">
      <tr>
        <th class="px-4 py-2 text-left">Time</th>
        <th class="px-4 py-2 text-left">User</th>
        <th class="px-4 py-2 text-left">Action</th>
        <th class="px-4 py-2 text-left">Resource</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
        <tr class="border-t">
          <td class="px-4 py-2">{{ log.timestamp.strftime('%Y-%m-%d %H:%M') }}</td>
          <td class="px-4 py-2">{{ log.user.email }}</td>
          <td class="px-4 py-2">{{ log.action }}</td>
          <td class="px-4 py-2">{{ log.resource_type }} #{{ log.resource_id }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
