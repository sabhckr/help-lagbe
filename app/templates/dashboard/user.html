{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Your Reports</h2>
{% if complaints %}
  <div class="space-y-3">
    {% for c in complaints %}
      <a href="{{ url_for('complaints.case_detail', id=c.id) }}" class="block p-4 bg-white rounded border hover:shadow">
        <div class="flex justify-between">
          <span class="font-medium">{{ c.title }}</span>
          <span class="text-xs">{{ c.status }}</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">{{ c.public_id }}</p>
      </a>
    {% endfor %}
  </div>
{% else %}
  <p>No reports submitted yet. <a href="{{ url_for('complaints.submit') }}" class="text-primary">Submit one</a></p>
{% endif %}
{% endblock %}
