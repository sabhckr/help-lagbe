{% extends "layouts/base.html" %}
{% block title %}{{ t('error.404_title') }} · {{ t('site.name') }}{% endblock %}
{% block content %}
<div class="error-page">
  <p class="eyebrow">{{ t('error.code') }} {{ code|bn_digits }}</p>
  <h1>{{ t('error.404_title') }}</h1>
  <p class="lead">{{ t('error.404_text') }}</p>
  <div class="cluster"><a class="btn btn-primary" href="{{ url_for('public.home') }}">{{ t('error.go_home') }}</a><a class="btn btn-ghost" href="{{ url_for('public.page', slug='get-help') }}">{{ t('nav.get_help') }}</a></div>
</div>
{% endblock %}
