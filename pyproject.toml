[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["E501", "S101", "B008", "N818", "N812", "S105", "S106", "S311", "UP035", "UP006"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/seed.py" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["migrations/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = ["B101"]
