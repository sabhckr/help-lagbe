[project]
name = "help-lagbe"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Bcrypt==1.0.1",
    "Flask-WTF==1.2.2",
    "WTForms==3.2.2",
    "Flask-Migrate==4.1.0",
    "Flask-Limiter==3.12",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "PyOTP==2.10.0",
    "segno==1.6.6",
    "email-validator==2.3.0",
    "python-dotenv==1.2.2",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.13",
    "redis==6.4.0",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["E501", "S101", "B008", "N818", "N812", "S105", "S106", "S311", "UP035", "UP006"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/seed.py" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["migrations/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = ["B101"]
